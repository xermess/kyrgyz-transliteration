[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyrgyz-transliteration"
version = "0.2.0"
description = "Транслитерация кыргызского языка: кириллица <-> английская ASCII-латиница"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["kyrgyz", "kirghiz", "transliteration", "romanization", "cyrillic", "latin", "english", "slugify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kyrgyz-transliteration = "kyrgyz_transliteration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kyrgyz_transliteration"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
